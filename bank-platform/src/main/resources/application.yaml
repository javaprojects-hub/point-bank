
spring:
  application:
    name: banking-platform

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/point_bank}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${OUTBOX_CONSUMER_GROUP_ID:pointbank-money-transfer-consumer}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 8000

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics"

  endpoint:
    health:
      show-details: never

info:
  app:
    name: Capital Bank Application
    description: Banking Microservices
    version: 1.0.0


server:
  port: 9898

app:
  kyc:
    storage-directory: ${KYC_STORAGE_DIRECTORY:./var/kyc-documents}

  security:
    jwt:
      issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/pointbank}
      audience: ${JWT_AUDIENCE:banking-test-client}
      roles-claim: ${JWT_ROLES_CLAIM:roles}



logging:
  level:
    com.pointbank.bankplatform: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX,UTC} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"

pointbank:
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    topic: ${OUTBOX_KAFKA_TOPIC:pointbank.money-transferred.v1}
    batch-size: ${OUTBOX_BATCH_SIZE:10}
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT1S}
    lease-duration: ${OUTBOX_LEASE_DURATION:PT2M}
    acknowledgment-timeout: ${OUTBOX_ACKNOWLEDGMENT_TIMEOUT:PT10S}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    base-retry-delay: ${OUTBOX_BASE_RETRY_DELAY:PT1S}
    max-retry-delay: ${OUTBOX_MAX_RETRY_DELAY:PT1M}
    consumer:
      enabled: ${OUTBOX_CONSUMER_ENABLED:true}
      group-id: ${OUTBOX_CONSUMER_GROUP_ID:pointbank-money-transfer-consumer}
      dead-letter-topic: ${OUTBOX_DLT_TOPIC:pointbank.money-transferred.v1.dlt}
      max-retries: ${OUTBOX_CONSUMER_MAX_RETRIES:5}
      retry-interval: ${OUTBOX_CONSUMER_RETRY_INTERVAL:PT2S}
      acknowledgment-timeout: ${OUTBOX_CONSUMER_ACKNOWLEDGMENT_TIMEOUT:PT10S}

  account:
    transaction-limits:
      rolling-window: PT24H
      savings:
        deposits: 99999.99
        withdrawals: 99999.99
      salary:
        deposits: 300000.00
        withdrawals: 300000.00
      # Unset current-account limits mean unrestricted transactions. Set either direction to a finite limit to constrain it.
      current: {}
      # Only COMPLETED transactions consume the gross-amount limit. FAILED, PENDING, and CANCELLED transactions do not.
      # Reversals are not exposed; any future reversal must be a separate compensating transaction that consumes its direction's limit.
      # Fees are not modeled and are therefore excluded from limit totals.